name: Handwritten math OCR benchmark (official Google TEST ink)
on:
  push:
    paths:
      - '.github/workflows/handwriting-benchmark.yml'
      - 'scripts/fetch_handwriting.py'
      - 'scripts/fetch_official_mathwriting.py'
      - 'scripts/python_reference_handwriting.py'
      - 'tests/handwriting-browser.mjs'
      - 'tests/handwriting-metrics.mjs'
  workflow_dispatch:
    inputs:
      offsets:
        description: 'Preselected test row indices (comma-separated)'
        required: true
        default: '0,3,7,11,19,27'
permissions:
  contents: read
jobs:
  handwriting:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install benchmark dependencies
        run: |
          python3 -m pip install --break-system-packages pillow
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Download fixed, real-human handwriting TEST samples
        run: |
          python3 scripts/fetch_official_mathwriting.py --out benchmark-fixtures --offsets "${{ inputs.offsets || '0,3,7,11,19,27' }}"
          python3 -c "import json; m=json.load(open('benchmark-fixtures/manifest.json')); assert len(m['items'])>0; assert m['split']=='test'"
      - name: Start static application
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/pix2tex-http.log 2>&1 &
          sleep 2
          curl -fsS http://127.0.0.1:8000/ >/dev/null
      - name: Benchmark real handwriting with browser ONNX OCR
        run: node tests/handwriting-browser.mjs
      - name: Compare upstream Python model on same handwriting PNGs
        continue-on-error: true
        run: |
          python3 -m pip install --break-system-packages rapid_latex_ocr
          python3 scripts/python_reference_handwriting.py
      - name: Publish brief result in workflow summary
        if: always()
        run: |
          if [ -f benchmark-results/handwriting-summary.md ]; then
            cat benchmark-results/handwriting-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Handwriting benchmark did not produce results. Check the failed step.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload metrics, provenance and comparisons (no source images)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: handwritten-math-benchmark-report
          path: |
            benchmark-results/
            benchmark-fixtures/manifest.json
          if-no-files-found: warn
          retention-days: 30
