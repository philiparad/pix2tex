name: Real ONNX browser smoke test (slow)
on:
  push:
    paths:
      - '.github/workflows/ocr-browser.yml'
      - 'src/onnx.js'
      - 'src/preprocess.js'
      - 'tests/ocr-browser-smoke.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-onnx:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium and Playwright
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Launch local static server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          sleep 2
          curl -f http://127.0.0.1:8000/index.html >/dev/null
      - name: Recognize formula using actual ONNX models
        run: node tests/ocr-browser-smoke.mjs
      - name: Compare original Python RapidLaTeXOCR model
        continue-on-error: true
        run: |
          python3 -m pip install --break-system-packages rapid_latex_ocr
          python3 - <<'PY'
          import json
          import numpy as np
          from PIL import Image
          from rapid_latex_ocr import LaTeXOCR
          model=LaTeXOCR()
          print('Python baseline:',model('/tmp/pix2tex-benchmark.png'))
          raw=np.array(Image.open('/tmp/pix2tex-benchmark.png').convert('RGB'))
          pad=model.pre_pro.pad(Image.fromarray(raw))
          initial_image=model.pre_pro.minmax_size(pad).convert('RGB')
          initial_tensor,_=model.pre_process(initial_image,1,initial_image.size[0],initial_image.size[1])
          predicted=model.image_resizer([initial_tensor.astype(np.float32)])[0]
          print('Python initial image size:',pad.size,initial_image.size,'tensor:',initial_tensor.shape,'mean:',initial_tensor.mean(),'predicted width:',(np.argmax(predicted)+1)*32)
          h=initial_image.size[1]
          w=initial_image.size[0]
          ratio=1
          for i in range(5):
              h=int(h*ratio)
              tensor,pad_step=model.pre_process(initial_image,ratio,w,h)
              size_scores=model.image_resizer([tensor.astype(np.float32)])[0]
              proposed=(int(np.argmax(size_scores))+1)*32
              print('Python resize step',i+1,'tensor',tensor.shape,'mean',round(float(tensor.mean()),6),'pad',pad_step.size,'predicted',proposed)
              if proposed==pad_step.size[0]: break
              w=proposed
              ratio=w/pad_step.size[0]
          ref=model.loop_image_resizer(raw)
          browser=json.load(open('/tmp/pix2tex-browser-tensor.json'))
          js=np.array(browser['data'],dtype=np.float32).reshape(browser['dims'])
          print('Python tensor shape:',ref.shape,'min/max/mean:',ref.min(),ref.max(),ref.mean())
          print('Browser tensor shape:',js.shape,'min/max/mean:',js.min(),js.max(),js.mean())
          if ref.shape==js.shape:
              print('Tensor mean absolute error:',np.mean(np.abs(ref-js)))
              print('Tensor max absolute error:',np.max(np.abs(ref-js)))
          else:
              print('Tensor shape mismatch: compare preprocessing and resizer sequence')
          PY
